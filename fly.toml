# fly.toml — деплой HurmaStr на Fly.io (один інстанс, SQLite на томі /data)
app = "hurmastr-hr"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  # БД і вкладення — на постійному томі /data
  DATABASE_URL = "file:/data/app.db"
  STORAGE_DIR = "/data/storage"
  # Fly дає HTTPS на краю → cookie сесії secure
  COOKIE_SECURE = "true"
  PORT = "3000"
  # Наповнення при першому старті (базові дані + адмін). Демо-персонал — так,
  # щоб застосунок одразу був наочним; для чистого інстансу поставте "false".
  RUN_SEED = "true"
  SEED_DEMO = "true"
  SEED_ADMIN_EMAIL = "admin@hurmastr.app"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 200

# SQLite не масштабується горизонтально — рівно одна машина на том.
[[mounts]]
  source = "hurma_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
